<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Pro: Master the Ledger</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <nav style="width: 100%; max-width: 600px; padding: 15px;">
        <a href="../index.html" style="text-decoration: none; color: #64748b; font-weight: bold;">⬅️ Back to Portfolio</a>
    </nav>

    <header class="app-header">
        <div class="stats-bar">
            <div class="rank-display">
                <span id="rank-icon">🌱</span>
                <span id="rank-title">Accounting Intern</span>
            </div>
            <div class="streak-container">
                <span id="streak-fire">🔥</span>
                <span id="streak-count">0</span>
            </div>
            <div class="lives-container">
                <span id="lives-display">❤️❤️</span>
            </div>
        </div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
    </header>

    <main class="game-container">
        <nav class="mode-toggle">
            <button id="study-mode-btn" class="active">Study Mode 📖</button>
            <button id="test-mode-btn">Test Mode ✍️</button>
        </nav>

        <section id="flashcard-section" class="mode-view">
            <div class="card-scene">
                <div class="card" id="card-element">
                    <div class="card-face card-front">
                        <p class="category-label" id="card-category"></p>
                        <h2 id="card-question-text">Loading Questions...</h2>
                        <span class="tap-hint" style="font-size: 0.8rem; color: #94a3b8;">Click to reveal answer 🔄</span>
                    </div>
                    <div class="card-face card-back">
                        <div class="back-content">
                            <h3 style="color: #1e3a8a;">The Ledger's Verdict:</h3>
                            <p id="card-answer-text" style="font-size: 1.3rem; font-weight: bold;"></p>
                            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">
                            <p id="card-insight" class="insight-text" style="font-style: italic; color: #475569;"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="controls" style="display: flex; gap: 15px; justify-content: center;">
                <button id="prev-btn" style="padding: 10px 20px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; cursor: pointer;">Previous</button>
                <button id="next-btn" style="padding: 10px 20px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; cursor: pointer;">Next Card</button>
            </div>
        </section>

        <section id="quiz-section" class="mode-view hidden">
            <div class="quiz-box" style="background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 350px;">
                <p class="category-label" id="quiz-category"></p>
                <h2 id="quiz-question-text" style="font-size: 1.2rem; margin-bottom: 20px;"></h2>
                <div id="options-container" class="options-grid"></div>
                <div id="feedback-message" class="hidden" style="margin-top: 20px; padding: 15px; border-radius: 10px; text-align: center;"></div>
            </div>
        </section>
    </main>

    <footer class="terms-footer">
        <h3 style="font-size: 0.9rem; color: #64748b; margin-bottom: 10px;">Key Concepts</h3>
        <div id="key-terms-list"></div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
