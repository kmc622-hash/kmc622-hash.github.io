<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Pro: Master the Ledger</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="stats-bar">
            <div class="rank-display">
                <span id="rank-icon">🌱</span>
                <span id="rank-title">Accounting Intern</span>
            </div>
            <div class="streak-container">
                <span id="streak-fire">🔥</span>
                <span id="streak-count">0</span>
            </div>
            <div class="lives-container">
                <span id="lives-display">❤️❤️</span>
            </div>
        </div>
        
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
    </header>

    <main class="game-container">
        <nav class="mode-toggle">
            <button id="study-mode-btn" class="active">Study Mode 📖</button>
            <button id="test-mode-btn">Test Mode ✍️</button>
        </nav>

        <section id="flashcard-section" class="mode-view">
            <div class="card-scene">
                <div class="card" id="card-element">
                    <div class="card-face card-front">
                        <p class="category-label" id="card-category"></p>
                        <h2 id="card-question-text">Loading...</h2>
                        <span class="tap-hint">Click to flip 🔄</span>
                    </div>
                    <div class="card-face card-back">
                        <div class="back-content">
                            <h3>The Ledger's Verdict:</h3>
                            <p id="card-answer-text"></p>
                            <hr>
                            <p id="card-insight" class="insight-text"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button id="prev-btn">Previous</button>
                <button id="next-btn">Next Card</button>
            </div>
        </section>

        <section id="quiz-section" class="mode-view hidden">
            <div class="quiz-box">
                <p class="category-label" id="quiz-category"></p>
                <h2 id="quiz-question-text"></h2>
                <div id="options-container" class="options-grid">
                    </div>
                <div id="feedback-message" class="hidden"></div>
            </div>
        </section>
    </main>

    <footer class="terms-footer">
        <h3>Key Concepts</h3>
        <div id="key-terms-list"></div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
